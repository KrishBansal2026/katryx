<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a0e08">
  <title>404 — Piece Not Found | KATRYX</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-bg-dark: #170d07;
      --color-espresso: #25140c;
      --color-cognac: #a56b3d;
      --color-gold: #cfa86e;
      --color-parchment: #f7ecd9;
      --color-muted: #9f8e80;
      --color-border: rgba(165, 107, 61, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 35%, #2a160d 0%, #130a05 100%);
      color: var(--color-parchment);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 5vw, 64px) 20px;
      text-align: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient luxury leather texture overlay */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(207, 168, 110, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      opacity: 0.6;
    }

    .error-container {
      position: relative;
      z-index: 2;
      max-width: 640px;
      margin: 0 auto;
      padding: clamp(32px, 5vw, 56px) clamp(24px, 4vw, 48px);
      background: rgba(37, 20, 12, 0.65);
      border: 1px solid var(--color-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5);
    }

    .brand-crest {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--color-parchment);
      margin-bottom: 6px;
    }

    .brand-kicker {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--color-cognac);
      margin-bottom: clamp(24px, 4vw, 36px);
    }

    .error-code {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(80px, 14vw, 130px);
      font-weight: 600;
      line-height: 0.9;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #dfcaa7 0%, #cfa86e 50%, #8c5b32 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 14px;
    }

    .error-tagline {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 500;
      font-style: italic;
      color: #fffaf0;
      margin-bottom: 16px;
    }

    .error-desc {
      font-size: clamp(14px, 1.8vw, 15px);
      line-height: 1.7;
      color: var(--color-muted);
      margin-bottom: clamp(28px, 4vw, 40px);
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    .error-actions {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      justify-content: center;
    }

    .btn-return {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 36px;
      background: var(--color-cognac);
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      border: 1px solid var(--color-cognac);
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(165, 107, 61, 0.25);
    }

    .btn-return:hover {
      background: #b87b49;
      border-color: #b87b49;
      transform: translateY(-1px);
    }

    .link-explore {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--color-gold);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .link-explore:hover {
      color: #ffffff;
      border-color: var(--color-gold);
    }

    .error-footer {
      margin-top: clamp(28px, 4vw, 44px);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(207, 168, 110, 0.6);
      border-top: 1px solid rgba(165, 107, 61, 0.18);
      padding-top: 16px;
    }

    @media (min-width: 540px) {
      .error-actions {
        flex-direction: row;
        gap: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="error-container" role="main">
    <div class="brand-crest">KATRYX</div>
    <div class="brand-kicker">Handcrafted Leather Goods • Bengaluru</div>

    <h1 class="error-code" aria-label="Error 404">404</h1>
    <h2 class="error-tagline">This piece seems to be lost.</h2>

    <p class="error-desc">
      The page or atelier archive you are looking for has been moved, renamed, or is currently undergoing bespoke restoration in our workshop.
    </p>

    <div class="error-actions">
      <a href="/" class="btn-return">
        <span>Return to KATRYX</span>
        <span>→</span>
      </a>
      <a href="/#collection" class="link-explore">Explore Collection</a>
    </div>

    <div class="error-footer">
      ATELIER ARCHIVE &bull; BENGALURU, INDIA
    </div>
  </main>
</body>
</html>
