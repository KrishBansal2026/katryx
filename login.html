<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241813">
  <title>Sign in | KATRYX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body.katryx-auth-page{min-height:100vh;background:#f3eee7;color:#25150f;font-family:"Plus Jakarta Sans",sans-serif}
    .auth-shell{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr)}
    .auth-art{position:relative;min-height:100vh;background:linear-gradient(135deg,rgba(35,18,10,.16),rgba(35,18,10,.62)),url("assets/images/hero-campaign.svg") center/cover;display:flex;align-items:flex-end;padding:clamp(32px,6vw,90px);color:#fff}
    .auth-art h1{font:600 clamp(48px,6vw,88px)/.95 "Cormorant Garamond",serif;max-width:650px;margin:0 0 18px}
    .auth-art p{max-width:470px;line-height:1.7;color:#f5e8d8}
    .auth-panel{display:flex;align-items:center;justify-content:center;padding:42px 28px}
    .auth-card{width:min(100%,460px);background:#fffdf9;padding:clamp(28px,4vw,48px);box-shadow:0 24px 80px rgba(48,29,17,.12)}
    .auth-brand{font:600 28px "Cormorant Garamond",serif;letter-spacing:.22em;text-transform:uppercase;text-align:center}
    .auth-kicker{text-align:center;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#a56b3d;margin:8px 0 32px}
    .auth-card h2{text-align:center;font:600 38px "Cormorant Garamond",serif;margin:0 0 8px}
    .auth-lead{text-align:center;color:#82766d;font-size:13px;line-height:1.6;margin:0 0 25px}
    .auth-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #e5d9cc;margin-bottom:24px}
    .auth-tabs button{border:0;background:none;padding:13px 8px;color:#8c8178;font:600 12px "Plus Jakarta Sans";cursor:pointer;border-bottom:2px solid transparent}
    .auth-tabs button.active{color:#422516;border-color:#a56b3d}
    .auth-form{display:grid;gap:10px}\n    .auth-form[hidden]{display:none !important}
    .auth-form label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#79695e;margin-top:8px}
    .auth-form input{width:100%;padding:14px 15px;border:1px solid #ded2c6;background:#fff;color:#25150f;font:14px "Plus Jakarta Sans";outline:none}
    .auth-form input:focus{border-color:#a56b3d;box-shadow:0 0 0 3px rgba(165,107,61,.12)}
    .auth-submit{margin-top:16px;padding:15px;background:#32190e;color:#fff;border:1px solid #32190e;font:600 12px "Plus Jakarta Sans";letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
    .auth-submit:disabled{opacity:.6;cursor:wait}
    .auth-message{min-height:20px;font-size:12px;line-height:1.5;color:#a33;text-align:center}
    .auth-back{text-align:center;margin-top:22px;font-size:12px;color:#786b61}
    .auth-back a{color:#6e4024;text-decoration:underline}
    .auth-foot{text-align:center;font-size:10px;color:#9a8d82;margin-top:26px;letter-spacing:.08em}
    @media(max-width:850px){.auth-shell{grid-template-columns:1fr}.auth-art{min-height:34vh;padding:32px}.auth-art h1{font-size:48px}.auth-panel{padding:28px 16px}.auth-card{box-shadow:none}}
  </style>
</head>
<body class="katryx-auth-page">
  <main class="auth-shell">
    <section class="auth-art" aria-label="Katryx leather collection">
      <div>
        <h1>Crafted to be yours.</h1>
        <p>Discover considered leather goods, made with character and personalised with your story.</p>
      </div>
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <div class="auth-brand">KATRYX</div>
        <div class="auth-kicker">Leather Goods • Made to Last</div>
        <h2 id="form-heading">Welcome back</h2>
        <p class="auth-lead" id="form-lead">Sign in to access your account, saved designs and orders.</p>
        <div class="auth-tabs">
          <button type="button" class="active" id="login-tab">Sign In</button>
          <button type="button" id="register-tab">Create Account</button>
        </div>
        <form class="auth-form" id="login-form">
          <label for="login-email">Email address</label>
          <input id="login-email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="Your password" required minlength="6">
          <div class="auth-message" id="login-message" role="alert"></div>
          <button class="auth-submit" type="submit">Sign In</button>
        </form>
        <form class="auth-form" id="register-form" hidden>
          <label for="register-name">Full name</label>
          <input id="register-name" type="text" autocomplete="name" placeholder="Your full name" required>
          <label for="register-email">Email address</label>
          <input id="register-email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <label for="register-password">Password</label>
          <input id="register-password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6">
          <div class="auth-message" id="register-message" role="alert"></div>
          <button class="auth-submit" type="submit">Create Account</button>
        </form>
        <div class="auth-back"><a href="index.html">← Back to KATRYX</a></div>
        <div class="auth-foot">SECURE ACCOUNT ACCESS • KATRYX</div>
      </div>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-service.js"></script>
  <script>
    (function () {
      const service = window.FirebaseService;
      const loginTab = document.getElementById('login-tab');
      const registerTab = document.getElementById('register-tab');
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const heading = document.getElementById('form-heading');
      const lead = document.getElementById('form-lead');

      try {
        if (service && service.init) service.init();
      } catch (error) {
        console.error('Firebase initialization failed:', error);
      }

      function setMode(mode) {
        const isRegister = mode === 'register';
        loginForm.hidden = isRegister;
        registerForm.hidden = !isRegister;
        loginTab.classList.toggle('active', !isRegister);
        registerTab.classList.toggle('active', isRegister);
        heading.textContent = isRegister ? 'Create your account' : 'Welcome back';
        lead.textContent = isRegister
          ? 'Join KATRYX to save your designs and keep track of your orders.'
          : 'Sign in to access your account, saved designs and orders.';
      }
      loginTab.addEventListener('click', () => setMode('login'));
      registerTab.addEventListener('click', () => setMode('register'));

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = document.getElementById('login-message');
        const button = loginForm.querySelector('button[type="submit"]');
        message.textContent = '';
        button.disabled = true;
        try {
          if (!service || !service.loginUser) throw new Error('Firebase service did not load. Check your connection and reload.');
          await service.loginUser(document.getElementById('login-email').value, document.getElementById('login-password').value);
          window.location.href = 'index.html';
        } catch (error) {
          message.textContent = error.message || 'Could not sign in. Please try again.';
        } finally {
          button.disabled = false;
        }
      });

      registerForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = document.getElementById('register-message');
        const button = registerForm.querySelector('button[type="submit"]');
        message.textContent = '';
        button.disabled = true;
        try {
          if (!service || !service.registerUser) throw new Error('Firebase service did not load. Check your connection and reload.');
          await service.registerUser(
            document.getElementById('register-name').value,
            document.getElementById('register-email').value,
            document.getElementById('register-password').value
          );
          window.location.href = 'index.html';
        } catch (error) {
          message.textContent = error.message || 'Could not create your account. Please try again.';
        } finally {
          button.disabled = false;
        }
      });

      if (service && service.onAuthChange) {
        service.onAuthChange(user => {
          if (user && !window.location.search.includes('stay')) {
            window.location.href = 'index.html';
          }
        });
      }
    })();
  </script>
</body>
</html>
